<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LIS Audit Panel</title>

    <link rel="stylesheet" href="css/notifications.css">
    <link rel="stylesheet" href="css/realtime-indicators.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
        }

        .topbar {
            background-color: #222;
            padding: 15px 20px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topbar .nav-links a {
            margin-right: 20px;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .content {
            padding: 25px;
        }

        .notif-icon {
            cursor: pointer;
            position: relative;
        }

        .notif-count {
            background: red;
            color: white;
            border-radius: 50%;
            padding: 3px 7px;
            font-size: 11px;
            position: absolute;
            top: -5px;
            right: -10px;
        }

        .audit-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            max-height: 500px;
            overflow-y: auto;
        }

        .audit-entry {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>

<body onload="initAuditPage()">

    <!-- HEADER -->
    <div class="topbar">
        <div class="logo-text">Audit Panel</div>

        <div class="nav-links">
            <a href="admin.html">Admin Dashboard</a>
        </div>

        <div class="notif-icon" onclick="toggleNotifications()">
            🔔
            <span id="notifCount" class="notif-count">0</span>
        </div>
    </div>

    <!-- NOTIFICATION BOX -->
    <div id="notificationBox"
        style="display:none; position:absolute; right:20px; top:70px; background:white; width:300px; 
               box-shadow:0 0 10px rgba(0,0,0,0.2); padding:10px; max-height:300px; overflow-y:auto;">
        <h4>Notifications</h4>
        <div id="notificationList"></div>
    </div>

    <!-- MAIN PAGE -->
    <div class="content">
        <h2>Audit Dashboard</h2>
        <p><strong>Monitoring system changes in real-time.</strong></p>
        <p>Listening for system updates…</p>

        <div class="audit-box" id="auditBox">
            <div class="audit-entry">Initializing audit logs…</div>
        </div>
    </div>


    <!-- JS BACKEND LOGIC -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/helpers.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/socket.js"></script>

    <script>
        async function initAuditPage() {
            console.log("🔍 Initializing Audit Page...");

            // Must be logged in
            await checkAuthAdmin();

            // Load notifications
            loadNotifications();

            // Load past audit log
            if (typeof loadAuditLog === "function") {
                loadAuditLog();
            }

            // Listen for real-time audit events
            if (typeof initAuditSocket === "function") {
                initAuditSocket();
            }

            console.log("✅ Audit page ready");
        }

        function toggleNotifications() {
            const box = document.getElementById("notificationBox");
            box.style.display = box.style.display === "block" ? "none" : "block";
        }
    </script>
</body>
</html>
