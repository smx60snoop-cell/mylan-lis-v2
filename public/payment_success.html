<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payment Successful</title>

    <link rel="stylesheet" href="/css/notifications.css">
    <link rel="stylesheet" href="/css/realtime-indicators.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
        }

        header {
            background: #003d8f;
            padding: 15px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #notificationBadge {
            background: red;
            padding: 3px 6px;
            border-radius: 50%;
            font-size: 11px;
        }

        #notificationBox {
            position: absolute;
            right: 15px;
            top: 60px;
            width: 250px;
            background: white;
            border: 1px solid #ccc;
            display: none;
            max-height: 300px;
            overflow-y: auto;
            z-index: 999;
        }

        .notification-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
        }

        h2 { color: #003d8f; }
        p { font-size: 16px; }

        .success-icon {
            font-size: 45px;
            color: green;
            margin-bottom: 10px;
        }

        .btn-home {
            padding: 12px 20px;
            background: #003d8f;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<header>
    <h3>MyLAN InfoTech</h3>
    <div onclick="toggleNotifications()" style="cursor: pointer;">
        🔔 <span id="notificationBadge">0</span>
        <div id="notificationBox"></div>
    </div>
</header>

<div class="container">
    <div class="success-icon">✔</div>
    <h2>Payment Successful</h2>
    <p>Your transaction was completed successfully.</p>
    <p>You may now return to your dashboard or continue exploring.</p>

    <a class="btn-home" href="/index.html">Go Back Home</a>
</div>

<script>
function toggleNotifications() {
    const box = document.getElementById("notificationBox");
    box.style.display = box.style.display === "block" ? "none" : "block";
}
</script>

<!-- Core backend scripts -->
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/admin.js"></script>

<!-- Existing scripts -->
<script src="/socket.io/socket.io.js"></script>
<script src="/js/helpers.js"></script>
<script src="/js/notifications.js"></script>
<script src="/js/socket.js"></script>

</body>
</html>
