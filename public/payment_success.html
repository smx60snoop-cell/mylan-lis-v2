<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #27ae60;
            font-size: 2em;
            margin-bottom: 10px;
        }
        p {
            color: #555;
            margin-bottom: 20px;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 2s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .btn-home {
            background-color: #3498db;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="status-heading">Processing Payment...</h1>
        <div id="loader" class="loader"></div>
        <p id="message">Please wait while we verify your payment with Paystack.</p>
        <a href="/" class="btn-home" id="home-link" style="display: none;">Return to Map</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const reference = urlParams.get('reference');
            const statusHeading = document.getElementById('status-heading');
            const messageText = document.getElementById('message');
            const loader = document.getElementById('loader');
            const homeLink = document.getElementById('home-link');

            // JWT helper (copied from index.html for standalone functionality)
            const fetchWithAuth = async (url, options = {}) => {
                const token = localStorage.getItem('jwtToken');
                const headers = { ...options.headers };
                if (token) {
                    headers['Authorization'] = `Bearer ${token}`;
                }
                const response = await fetch(url, { ...options, headers: headers });
                // Simplified auth check for this page
                if (response.status === 401 || response.status === 403) {
                     window.location.href = '/'; 
                }
                return response;
            };

            const verifyPayment = async (ref) => {
                const userId = JSON.parse(localStorage.getItem('currentUser'))?.id;

                if (!ref || !userId) {
                    statusHeading.textContent = 'Error!';
                    statusHeading.style.color = '#e74c3c';
                    messageText.textContent = 'Missing payment reference or user information. Please log in and try again.';
                    loader.style.display = 'none';
                    homeLink.style.display = 'block';
                    return;
                }
                
                try {
                    const response = await fetchWithAuth(`/api/paystack/verify-completion?reference=${ref}`);
                    
                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.message || 'Verification failed on server.');
                    }

                    statusHeading.textContent = 'Payment Complete!';
                    statusHeading.style.color = '#27ae60';
                    messageText.innerHTML = `Your transaction was successful. Application Status: <strong>${data.application_status}</strong>.`;
                    
                    // Optional: Provide a deep link back to the parcel
                    if (data.parcel_gid && data.parcel_schema) {
                        homeLink.href = `/?gid=${data.parcel_gid}&schema=${data.parcel_schema}`;
                        homeLink.textContent = 'View Parcel on Map';
                    }

                } catch (error) {
                    statusHeading.textContent = 'Payment Failed';
                    statusHeading.style.color = '#e74c3c';
                    messageText.textContent = `Error during final verification: ${error.message}. Please check your email or contact support.`;
                } finally {
                    loader.style.display = 'none';
                    homeLink.style.display = 'block';
                }
            };

            if (reference) {
                verifyPayment(reference);
            } else {
                statusHeading.textContent = 'Missing Reference';
                statusHeading.style.color = '#e74c3c';
                messageText.textContent = 'No payment reference found in the URL. Cannot verify transaction.';
                loader.style.display = 'none';
                homeLink.style.display = 'block';
            }
        });
    </script>
</body>
</html>
