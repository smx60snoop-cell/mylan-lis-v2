<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyLAN InfoTech – Land Information System</title>

    <link rel="stylesheet" href="css/notifications.css">
    <link rel="stylesheet" href="css/realtime-indicators.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
        }

        .topbar {
            background-color: #0b3d91;
            color: white;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topbar .title {
            font-size: 22px;
            font-weight: bold;
        }

        .notif-icon {
            cursor: pointer;
            position: relative;
            font-size: 22px;
        }

        .notif-count {
            background: red;
            color: white;
            font-size: 11px;
            padding: 3px 7px;
            border-radius: 50%;
            position: absolute;
            top: -5px;
            right: -12px;
        }

        .content {
            padding: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-top: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body onload="initPublicHome()">

    <!-- TOP NAV BAR -->
    <div class="topbar">
        <div class="title">MyLAN InfoTech</div>

        <div class="notif-icon" onclick="toggleNotifications()">
            🔔
            <span id="notifCount" class="notif-count">0</span>
        </div>
    </div>

    <!-- NOTIFICATIONS DROPDOWN -->
    <div id="notificationBox"
         style="display:none; position: absolute; right: 20px; top: 70px;
                background:white; width:300px; max-height: 350px; overflow-y:auto;
                padding:10px; border-radius:6px; box-shadow:0 0 10px rgba(0,0,0,0.2);">
        <h4>Notifications</h4>
        <div id="notificationList"></div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="content">
        <div class="card">
            <h2>Welcome to the Land Information System</h2>
            <p>This is the public portal.</p>
        </div>
    </div>

    <!-- REQUIRED JS FILES -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/helpers.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/socket.js"></script>

    <!-- PAGE LOGIC -->
    <script>
        function initPublicHome() {
            console.log("🌍 Initializing Public Index Page...");

            loadNotifications();    // Load notifications immediately
            initSocketConnection(); // Socket real-time setup if user is logged in
        }

        function toggleNotifications() {
            const box = document.getElementById("notificationBox");
            box.style.display = box.style.display === "block" ? "none" : "block";
        }
    </script>

</body>
</html>
